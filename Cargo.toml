[package]
name = "unreal-hub"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
futures = "0.3.34"
gpui = "=0.2.2"
jwalk = "0.9.0"
log = "0.4.35"
notify = "8.2.2"
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "tracing-log"] }
trash = "5.3.0"
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.2", features = ["v4"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
